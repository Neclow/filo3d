<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Filo3D — Filoviridae protein structures</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridjs@6.2.0/dist/theme/mermaid.min.css">
<style>
  :root {
    --bg: #ffffff; --fg: #1a1f24; --muted: #5c6773; --accent: #b3261e;
    --card: #f6f7f9; --border: #e2e6ea;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1317; --fg:#e6eaef; --muted:#9aa5b1; --accent:#ff6b5e;
            --card:#171c22; --border:#2a3138; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font: 15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
  header h1 { margin:0 0 4px; font-size: 1.7rem; letter-spacing:-0.01em; }
  header h1 span { color: var(--accent); }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .sub a { color: var(--accent); }
  .stats { display:flex; flex-wrap:wrap; gap:10px; margin: 0 0 22px; }
  .stat { background:var(--card); border:1px solid var(--border); border-radius:10px;
          padding:10px 14px; min-width:104px; }
  .stat b { display:block; font-size:1.35rem; }
  .stat span { color:var(--muted); font-size:.82rem; text-transform:uppercase; letter-spacing:.03em; }
  footer { color:var(--muted); font-size:.85rem; margin-top:28px; }
  footer a { color: var(--accent); }
  /* Grid.js dark-mode readability */
  @media (prefers-color-scheme: dark) {
    .gridjs-table, .gridjs-td, .gridjs-th, .gridjs-search-input,
    .gridjs-pagination, .gridjs-footer, .gridjs-header { color:var(--fg); }
    .gridjs-td, .gridjs-th { background:var(--bg); border-color:var(--border); }
    .gridjs-th { background:var(--card); }
    .gridjs-search-input { background:var(--card); border-color:var(--border); color:var(--fg); }
    .gridjs-pagination .gridjs-pages button { background:var(--card); color:var(--fg); border-color:var(--border); }
    table.gridjs-table td a { color: var(--accent); }
  }
  #err { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span>Filo3D</span> — Filoviridae protein structures</h1>
    <p class="sub">A searchable database of high-resolution filovirus structures from the
      RCSB PDB. <a href="https://github.com/Neclow/filo3d">Source & pipeline on GitHub</a>.</p>
  </header>

  <div class="stats" id="stats"></div>
  <div id="err"></div>
  <div id="table"></div>

  <footer id="foot"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/gridjs@6.2.0/dist/gridjs.umd.js"></script>
<script>
(async function () {
  const err = document.getElementById('err');
  let data;
  try {
    const res = await fetch('data.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    err.textContent = 'Could not load data.json (' + e.message + ').';
    return;
  }

  const m = data.meta || {};
  const stat = (n, l) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`;
  document.getElementById('stats').innerHTML =
    stat(m.n_structures ?? '–', 'structures') +
    stat(m.n_entities ?? '–', 'entities') +
    stat((m.species || []).length, 'species') +
    stat(m.n_protein ?? '–', 'protein chains');

  document.getElementById('foot').innerHTML =
    'Generated ' + (m.generated || '') + ' · species: ' + (m.species || []).join(', ') +
    ' · data: <a href="data.json">data.json</a>';

  // PDB (first column) → link to RCSB structure page.
  const columns = data.columns.map((name, i) => {
    if (i === 0) {
      return { name, formatter: (cell) => gridjs.html(
        `<a href="https://www.rcsb.org/structure/${String(cell).toUpperCase()}"
            target="_blank" rel="noopener">${cell}</a>`) };
    }
    return { name };
  });

  new gridjs.Grid({
    columns,
    data: data.rows,
    search: true,
    sort: true,
    resizable: true,
    pagination: { limit: 25, summary: true },
    className: { table: 'filo3d-table' },
    style: { table: { 'white-space': 'nowrap', 'font-size': '13.5px' } },
  }).render(document.getElementById('table'));
})();
</script>
</body>
</html>
